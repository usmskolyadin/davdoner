{% extends 'base.html' %}
{% block content %}
<section class="section">
  <div class="container auth-page">
    <h1>Регистрация</h1>
    <form method="post" class="auth-form">
      {% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label>{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<p class="field-error">{{ field.errors.0 }}</p>{% endif %}
          {% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn--primary btn--lg btn--block">Создать аккаунт</button>
    </form>
    <p class="auth-switch">Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a></p>
  </div>
</section>
{% endblock %}
